        .modal-overlay {
            background-color: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(2px);
        }

<body class="bg-background min-h-screen text-on-background font-body-md relative">
<!-- Background Image (Wallet Screen) -->
<div class="fixed inset-0 z-0 w-full h-full bg-cover bg-center bg-no-repeat" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB8vtOEDgMmy6TpDOlXTmrEgMqO2_pcSL49hppbqTKgLiroot0IZU52dbs1a1snkpq-209zzbWRUqZ94XfZ5tMQY8cIhbaAn9GwVwNB05BwLlNsj8S_HR-mtJi_7T6bN7voLqbNnh0ediPabtMDGxghHdGemIkbyVCQRoz1PQNhVzrN3K18jy04SAO7wTNqa1x8WcyeMVPdp_u0FuNJ1XyPc-C9hv5S5e7kXPqtv7FIWwjA_3_rv_r6eL9TQe7dVMJgdQW1jl21Ybo');"></div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center modal-overlay p-md">
<!-- Modal Container (Level 2 Elevation) -->
<div aria-labelledby="modal-title" aria-modal="true" class="bg-surface-container-lowest border border-surface-variant rounded-xl w-full max-w-md flex flex-col shadow-[0px_4px_12px_rgba(15,23,42,0.08)] overflow-hidden" role="dialog">
<!-- Modal Header -->
<div class="flex items-center justify-between p-lg border-b border-surface-variant">
<h2 class="font-h2 text-h2 text-on-surface" id="modal-title">Request Payout</h2>
<button aria-label="Close modal" class="text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 rounded-DEFAULT p-xs" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-lg flex flex-col gap-lg">
<!-- Balance Info Box -->
<div class="bg-surface-container-low rounded-lg p-md border border-surface-variant flex items-center justify-between">
<div>
<span class="block font-label text-label text-on-surface-variant mb-xs">Available Balance</span>
<span class="block font-h1 text-h1 text-on-surface">$2,450.00</span>
</div>
<div class="h-12 w-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
</div>
<!-- Input Area -->
<div class="flex flex-col gap-md">
<!-- Amount Input -->
<div class="flex flex-col gap-xs">
<label class="font-label text-label text-on-surface" for="payout-amount">Withdrawal Amount</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="font-body-md text-body-md text-on-surface-variant">$</span>
</div>
<input class="block w-full pl-xl pr-md py-sm font-body-md text-body-md bg-surface-container-lowest border border-outline-variant rounded-DEFAULT text-on-surface focus:ring-1 focus:ring-primary focus:border-primary placeholder:text-outline-variant transition-colors hover:border-outline" id="payout-amount" name="payout-amount" placeholder="0.00" type="text" value="2450.00"/>
</div>
<div class="flex justify-between items-center mt-xs">
<span class="font-body-sm text-body-sm text-on-surface-variant">Max available: $2,450.00</span>
<button class="font-label text-label text-primary hover:underline focus:outline-none" type="button">Withdraw All</button>
</div>
</div>
<!-- Destination Account Dropdown -->
<div class="flex flex-col gap-xs">
<label class="font-label text-label text-on-surface" for="bank-account">Transfer To</label>
<div class="relative">
<select class="block w-full pl-md pr-xl py-sm font-body-md text-body-md bg-surface-container-lowest border border-outline-variant rounded-DEFAULT text-on-surface focus:ring-1 focus:ring-primary focus:border-primary appearance-none hover:border-outline transition-colors" id="bank-account" name="bank-account">
<option value="chase-checking">Chase Checking (**** 1234)</option>
<option value="boa-savings">Bank of America Savings (**** 5678)</option>
<option value="add-new">Link New Account...</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center pr-md pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_drop_down</span>
</div>
</div>
</div>
</div>
<!-- Summary Info -->
<div class="flex flex-col gap-xs pt-md border-t border-surface-variant">
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-on-surface-variant">Estimated Arrival</span>
<span class="font-body-sm text-body-sm text-on-surface font-medium">1-3 Business Days</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-on-surface-variant">Fee</span>
<span class="font-body-sm text-body-sm text-on-surface font-medium">$0.00</span>
</div>
</div>
</div>
<!-- Modal Footer (Actions) -->
<div class="p-lg bg-surface-container-low border-t border-surface-variant flex gap-md justify-end">
<button class="px-md py-sm font-label text-label border border-outline-variant rounded-DEFAULT text-on-surface hover:bg-surface-container-highest hover:border-outline transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 bg-surface-container-lowest" type="button">
                    Cancel
                </button>
<button class="px-md py-sm font-label text-label bg-primary text-on-primary rounded-DEFAULT hover:opacity-90 transition-opacity focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 flex items-center gap-xs" type="button">
                    Confirm Payout
                </button>
</div>
</div>
</div>
